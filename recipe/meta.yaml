{% set version = "0.5.4" %}
# Defined in <project-repo>/ci/llvm-version.env (LLVM 23.x trunk commit)
{% set llvm_modern_commit = "3cbe75b1433a90a28db068d700b7effd2de8f401" %}
# Defined in <project-repo>/ci/llvm-version.env ('llvmorg-7.1.0' git tag)
{% set llvm7_commit = "4856a9330ee01d30e9e11b6c2f991662b4c04b07" %}

package:
  name: numba-cuda-mlir
  version: {{ version }}

source:
  - url: https://github.com/NVIDIA/numba-cuda-mlir/archive/refs/tags/v{{ version }}.tar.gz
    sha256: d54c30a053a840d9aa36003b0c184b7aec5b7fa013b677b9ccd22d0483977df7
    folder: src
    patches:
      - patches/pin-python-executable.patch
      - patches/0001-use-env-variables-to-unvendor-dlpack.patch
  # Direct source archive download from GitHub is not stable. Use git-clone instead.
  - git_url: https://github.com/llvm/llvm-project.git
    git_rev: {{ llvm_modern_commit }}
    folder: llvm-modern-src
  - git_url: https://github.com/llvm/llvm-project.git
    git_rev: {{ llvm7_commit }}
    folder: llvm7-src

build:
  number: 0
  skip: true  # [py<310 or not (linux or win)]
  # conda-build runs bld.bat / build.sh automatically (no 'script: file:' needed).
  # Bare names forward the variable from the host environment; 'NAME=value' sets a default.
  script_env:
    - NUMBA_CUDA_MLIR_VERSION={{ version }}
  # The CUDA runtime libs (cudart, nvrtc, nvjitlink, nvvm) are dlopen'd, and the bundled
  # legacy-LLVM lib (libLLVM-7.so on unix / LLVM-C.dll on win) plus MLIR C-API modules
  # are loaded dynamically, so exempt them from the link checks.
  missing_dso_whitelist:
    - '*/libLLVM-7.so'  # [unix]
    - '*/libMLIRPythonCAPI.so'  # [unix]
    - '*/libMLIRPythonSupport-numba_cuda_mlir.so'  # [unix]
    - '*/LLVM-C.dll'  # [win]
    - '*/MLIRPythonCAPI.dll'  # [win]
    - '*/MLIRModernToNVVM.dll'  # [win]
    - '*/MLIRPythonSupport-numba_cuda_mlir.dll'  # [win]
    - '*/nanobind-numba_cuda_mlir.dll'  # [win]

requirements:
  ignore_run_exports:
    - cuda-cudart
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.24
    - ninja-base
    - make  # [unix]
    - git
  host:
    - python
    - pip
    - setuptools >=64
    - wheel
    # Build deps for the modern LLVM/MLIR Python bindings:
    - numpy {{ numpy }}
    - pybind11
    # Anaconda: add to fix linter error 'pybind11_use_pybind11_abi'
    - pybind11-abi
    # nanobind >2.13 breaks numba-cuda-mlir's MLIR bindings
    - nanobind >=2.9,<2.13  # analint: host_section_needs_exact_pinnings
    # nanobind/stubgen.py requires the 'typing_extensions' package on py<3.11
    - typing-extensions  # [py<311]
    # Anaconda: add dlpack version to fix linter error
    # Ref: https://github.com/NVIDIA/numba-cuda-mlir/blob/v0.5.4/CMakeLists.txt#L44-L48
    - dlpack 1.1
    # The LLVM-C.dll that we create here for Windows links against zlib. Remove if we
    # migrate LLVM-C.dll creation to the llvmdev-feedstock.
    # Anaconda: libLLVM-7.so links against 'libz'.
    - zlib  {{ zlib }}  # [not (win and arm64)]
    # Anaconda: libLLVM-7.so links against 'libxml2'
    - libxml2 {{ libxml2 }}  # [not (win and arm64)]
  run:
    - python
    - numpy
    - typing-extensions  # [py<312]
    - cuda-version >=12.2,<14.0.0a0
    - cuda-cudart-dev
    - cuda-nvrtc
    - libnvjitlink >=12.3.0
    - cuda-nvvm-impl
    - cuda-nvvm-tools
    - cuda-cccl
    - cuda-bindings >=12.9.1,<14.0.0
    - cuda-core >=0.5.1,<2.0.0
    # cuda-core starts depending on cuda-pathfinder on v0.7.0, but the package accepts >=0.5.1
    # Minimum version of cuda-pathfinder that brings the required functionality is v0.3.4
    # The upper bound for cuda-pathfinder is defined by the transitive dependency chain from cuda-core
    - cuda-pathfinder >=1.3.4

test:
  requires:
    - pip
  files:
    - test_compile_ptx.py  # [not (win and arm64)]
  imports:
    - numba_cuda_mlir
    - numba_cuda_mlir._mlir.ir
  commands:
    - pip check
    - python -c "import numba_cuda_mlir; from numba_cuda_mlir import cuda"
    # Confirm the bundled native libraries are present and located.
    - python -c "import numba_cuda_mlir._mlir._mlir_libs as L, os; assert os.path.exists(os.path.join(os.path.dirname(L.__file__), 'libMLIRPythonCAPI.so'))"  # [linux]
    - python -c "import numba_cuda_mlir, os; assert os.path.exists(os.path.join(os.path.dirname(numba_cuda_mlir.__file__), 'lib', 'libLLVM-7.so'))"  # [linux]
    - python -c "import numba_cuda_mlir._mlir._mlir_libs as L, os; assert os.path.exists(os.path.join(os.path.dirname(L.__file__), 'MLIRPythonCAPI.dll'))"  # [win]
    - python -c "import numba_cuda_mlir, os; assert os.path.exists(os.path.join(os.path.dirname(numba_cuda_mlir.__file__), 'lib', 'LLVM-C.dll'))"  # [win and x86_64]
    # Compile-only (no GPU) check of the legacy (LLVM 7, sm_80) and modern
    # (MLIR, sm_100) code generation paths and their runtime dependencies.
    # Skipped on win-arm64, where LLVM 7 is not built.
    - python test_compile_ptx.py  # [not (win and arm64)]

about:
  home: https://github.com/NVIDIA/numba-cuda-mlir
  license: Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND NCSA AND BSD-2-Clause AND BSD-3-Clause AND MIT
  license_file:
    - src/LICENSE
    - src/NOTICE
    - src/THIRD-PARTY-LICENSES
    # nanobind (BSD-3-Clause) is compiled into the MLIR Python extensions and
    # libnanobind-numba_cuda_mlir; it embeds tsl::robin_map (MIT).
    - licenses/nanobind-LICENSE
    - licenses/robin-map-LICENSE
  license_family: Other
  summary: numba-cuda-mlir Python Compiler (MLIR/LLVM CUDA kernel backend)
  description: |
    Numba-CUDA-MLIR provides a programming model similar to CUDA C++ in Python. It is evolved from Numba-CUDA,
    and is intended to be compatible with Numba-CUDA kernels. Numba-CUDA-MLIR aims to interoperate well with
    existing programming models whilst also allowing experts sufficient control over code generation.
  dev_url: https://github.com/NVIDIA/numba-cuda-mlir
  doc_url: https://nvidia.github.io/numba-cuda-mlir

extra:
  skip-lints:
    # Skipping due to linter generating a false-positive error
    - pip_install_args
  recipe-maintainers:
    - conda-forge/cuda-python
    - brandon-b-miller
    - onurbingol
